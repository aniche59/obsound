<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ObSound — Curator Authentication &amp; Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(118, 179, 157, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(224, 122, 95, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(242, 204, 143, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }
    .auth-container {
      max-width: 480px;
      width: 90%;
      margin: auto;
      padding: 36px 32px;
      border-radius: var(--radius-lg);
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .tab-switch {
      display: flex;
      background: rgba(10, 14, 23, 0.8);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tab-btn.active {
      background: var(--accent-orange);
      color: #0b101d;
      box-shadow: 0 4px 15px rgba(224, 122, 95, 0.35);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(10, 14, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.2);
    }
    .form-feedback {
      font-size: 11px;
      margin-top: 5px;
      color: #ff6b6b;
      display: none;
    }
    .form-feedback.show {
      display: block;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-orange), #f2cc8f);
      color: #0b101d;
      font-weight: 800;
      font-size: 14px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 10px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(224, 122, 95, 0.4);
    }
    .curator-badge-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(118, 179, 157, 0.1);
      border: 1px dashed var(--accent-mint);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }
    .curator-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-mint), var(--accent-orange));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #0b101d;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="app-header glass" style="justify-content: space-between; padding: 14px 28px;">
    <a href="app.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
      <h1 class="logo" style="margin: 0; font-size: 22px;">Ob<span>Sound</span></h1>
      <span class="badge" style="background: rgba(118, 179, 157, 0.2); color: var(--accent-mint); font-size: 10px; padding: 4px 8px; border-radius: 12px;">CURATOR VAULT</span>
    </a>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="app.html" class="nav-link" style="color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600;">
        <i class="bi bi-compass"></i> Galaxy Graph
      </a>
      <a href="crate.html" class="nav-link" style="color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600;">
        <i class="bi bi-collection-play"></i> My Crate
      </a>
    </div>
  </header>

  <!-- Main Auth Box -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 0;">
    <div class="auth-container">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 6px;">
          Curator Terminal
        </h2>
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0;">
          Authenticate to sync your crates, playlists &amp; discovered nodes with the NoSQL cloud store.
        </p>
      </div>

      <!-- Tab Switcher -->
      <div class="tab-switch">
        <button id="tab-login-btn" class="tab-btn active">SIGN IN</button>
        <button id="tab-register-btn" class="tab-btn">CREATE CURATOR ID</button>
      </div>

      <!-- Live Notification Banner -->
      <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 16px;"></div>

      <!-- 1. LOGIN FORM -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Curator Handle or Email</label>
          <input type="text" id="login-email" class="form-input" placeholder="@analog_digger or digger@obsound.org" required>
          <div class="form-feedback" id="login-email-fb"></div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••••••" required>
          <div class="form-feedback" id="login-pwd-fb"></div>
        </div>

        <button type="submit" class="submit-btn" id="login-submit-btn">
          <i class="bi bi-box-arrow-in-right me-1"></i> ACCESS VAULT
        </button>
      </form>

      <!-- 2. REGISTER FORM -->
      <form id="register-form" style="display: none;">
        <div class="curator-badge-preview">
          <div class="curator-avatar" id="reg-avatar-preview">?</div>
          <div>
            <div style="font-weight: 700; font-size: 13px;" id="reg-handle-preview">@new_curator</div>
            <div style="font-size: 11px; color: var(--text-secondary);" id="reg-genre-preview">Dungeon Synth / Vaporwave</div>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-handle">Curator Handle</label>
          <input type="text" id="reg-handle" class="form-input" placeholder="@underground_digger" required>
          <div class="form-feedback" id="reg-handle-fb"></div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="curator@sound.io" required>
          <div class="form-feedback" id="reg-email-fb"></div>
        </div>

        <div class="form-group">
          <label for="reg-favgenre">Core Sonic Aesthetic</label>
          <select id="reg-favgenre" class="form-select">
            <option value="Dungeon Synth">Dungeon Synth</option>
            <option value="Deconstructed Club">Deconstructed Club</option>
            <option value="HexD">HexD</option>
            <option value="Mallsoft">Mallsoft</option>
            <option value="Darkwave">Darkwave</option>
            <option value="Breakcore">Breakcore</option>
            <option value="Shoegaze">Shoegaze</option>
            <option value="Vaporwave" selected>Vaporwave</option>
            <option value="Midwest Emo">Midwest Emo</option>
            <option value="Phonk">Phonk / Wave</option>
            <option value="Ambient Drone">Ambient Drone</option>
            <option value="Chiptune">Chiptune</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reg-password">Password (min 6 characters)</label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••••••" required>
          <div class="form-feedback" id="reg-pwd-fb"></div>
        </div>

        <button type="submit" class="submit-btn" id="reg-submit-btn">
          <i class="bi bi-shield-check me-1"></i> INITIALIZE PROFILE &amp; CLOUD CRATE
        </button>
      </form>

      <!-- Fast Guest Demo Login -->
      <div style="margin-top: 20px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 16px;">
        <span style="font-size: 11px; color: var(--text-secondary);">Looking to test right away?</span><br>
        <button id="quick-demo-btn" type="button" style="background: transparent; border: 1px solid var(--accent-mint); color: var(--accent-mint); font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 20px; margin-top: 8px; cursor: pointer;">
          ⚡ Sign in as Demo Curator (@analog_digger)
        </button>
      </div>

    </div>
  </div>

  <script>
    // Tab switching
    const tabLogin = document.getElementById('tab-login-btn');
    const tabRegister = document.getElementById('tab-register-btn');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const alertBox = document.getElementById('auth-alert');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      alertBox.style.background = isSuccess ? 'rgba(118, 179, 157, 0.2)' : 'rgba(255, 107, 107, 0.2)';
      alertBox.style.border = isSuccess ? '1px solid var(--accent-mint)' : '1px solid #ff6b6b';
      alertBox.style.color = isSuccess ? 'var(--accent-mint)' : '#ff6b6b';
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
      alertBox.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
      alertBox.style.display = 'none';
    });

    // Live avatar preview
    const regHandleInput = document.getElementById('reg-handle');
    const regGenreSelect = document.getElementById('reg-favgenre');
    const regAvatarPreview = document.getElementById('reg-avatar-preview');
    const regHandlePreview = document.getElementById('reg-handle-preview');
    const regGenrePreview = document.getElementById('reg-genre-preview');

    regHandleInput.addEventListener('input', () => {
      let val = regHandleInput.value.trim();
      if (!val.startsWith('@') && val.length > 0) val = '@' + val;
      regHandlePreview.textContent = val || '@new_curator';
      regAvatarPreview.textContent = (val.replace('@', '')[0] || '?').toUpperCase();
    });

    regGenreSelect.addEventListener('change', () => {
      regGenrePreview.textContent = regGenreSelect.value;
    });

    // Handle Registration
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let handle = regHandleInput.value.trim();
      if (!handle.startsWith('@')) handle = '@' + handle;
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const genre = regGenreSelect.value;

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters.');
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ handle, email, password, genre })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        localStorage.setItem('obsound_user', JSON.stringify(data.user));
        localStorage.setItem('obsound_token', data.token);
        showAlert('Curator ID created! Syncing vault and redirecting...', true);
        setTimeout(() => window.location.href = 'app.html', 1200);
      } catch (err) {
        showAlert(err.message);
      }
    });

    // Handle Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication rejected');

        localStorage.setItem('obsound_user', JSON.stringify(data.user));
        localStorage.setItem('obsound_token', data.token);
        showAlert(`Welcome back, ${data.user.handle}! Opening vault...`, true);
        setTimeout(() => window.location.href = 'app.html', 1000);
      } catch (err) {
        showAlert(err.message);
      }
    });

    // Quick demo login
    document.getElementById('quick-demo-btn').addEventListener('click', () => {
      const demoUser = {
        id: "curator_demo_01",
        handle: "@analog_digger",
        email: "digger@obsound.org",
        genre: "Vaporwave",
        avatar: "A"
      };
      localStorage.setItem('obsound_user', JSON.stringify(demoUser));
      localStorage.setItem('obsound_token', 'demo_vault_token_777');
      showAlert('Signed in as @analog_digger! Loading crates...', true);
      setTimeout(() => window.location.href = 'app.html', 800);
    });
  </script>
</body>
</html>
